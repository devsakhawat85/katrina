# Netlify Configuration for Mind & Body Mastery
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA Fallback: guarantees client-side navigation works seamlessly on all direct URLs & refreshes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# High-Performance HTTP Headers: asset caching & security headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
